[package]
name = "hornets-dashboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
libm = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-stream = "0.3"
